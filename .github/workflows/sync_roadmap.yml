name: Sync Roadmap to Issues

on:
  push:
    paths:
      - 'Docs/production_roadmap.md'
      - 'backend/scripts/sync_roadmap_to_github.py'
  workflow_dispatch: # Mahdollistaa manuaalisen ajon GitHubin kautta

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backend/scripts/sync_roadmap_to_github.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Docs/production_roadmap.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update roadmap with issue numbers [skip ci]" && git push)
