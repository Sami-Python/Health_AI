name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-north1
  SERVICE_NAME: health-ai-backend
  REPO_NAME: health-ai-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Configure Docker
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 4. Prepare Image Tag (Force Lowercase)
      - name: Prepare Image Tag
        run: |
          RAW_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "IMAGE_TAG=$(echo $RAW_TAG | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 5. Build and Push Container
      - name: Build and Push
        run: |
          docker build -t ${{ env.IMAGE_TAG }} ./backend
          docker push ${{ env.IMAGE_TAG }}

      # 6. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: '--allow-unauthenticated'
          env_vars: |
            APP_ENV=production
            DEBUG=false
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            USE_SECRET_MANAGER=true
          secrets: |
            GARMIN_EMAIL=GARMIN_EMAIL:latest
            GARMIN_PASSWORD=GARMIN_PASSWORD:latest
            FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            ENCRYPTION_KEY=ENCRYPTION_KEY:latest
