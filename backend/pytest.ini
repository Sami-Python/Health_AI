[pytest]
# Pytest configuration for Health AI Backend

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    integration: Integration tests that require Firebase Emulator
    unit: Unit tests with mocked dependencies
    slow: Tests that take >5 seconds

# Output options
# Skip integration tests by default (they require Firebase Emulator)
# To run integration tests: pytest -m integration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not integration"

# Coverage options (when using --cov)
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
