version: '3.8'

services:
  backend:
    build: ./backend
    container_name: health_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app       # Hot reload code
      # Map Health_AI to root so that os.chdir(project_root) works as expected
      - ./Health_AI:/Health_AI 
    environment:
      - DB_FILE_PATH=/app/data/health_ai.db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account_key.json
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
