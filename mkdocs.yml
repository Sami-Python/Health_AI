site_name: Health AI Coach
site_url: https://Samih.github.io/health_ai/
repo_url: https://github.com/Samih/health_ai
repo_name: Samih/health_ai

theme:
  name: material
  palette: 
    # Light mode
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - navigation.top

docs_dir: Docs

nav:
  - Etusivu: index.md
  
  - Käytön aloitus:
    - Yleiskatsaus: index.md
    - Ympäristö & Julkaisu: deployment.md
    - Autentikaatio: authentication.md
    - Landing Page: landing_page.md

  - Arkkitehtuuri & Suunnittelu:
    - Arkkitehtuurin yleiskuvaus: arkkitehtuuri.md
    - Datavirrat: data_flow.md
    - Vaatimusmäärittely: vaatimusmaarittely.md
    - Tietoturvaraportti: security_audit.md
    - AI Chat Feature Plan: chat_feature_plan.md
    - Mobile vs Web: mobile_vs_web_comparison.md

  - Kehitysoppaat:
    - Garmin-integraatio: garmin_setup.md
    - Garmin Cloudflare Bypass: garmin_cloudflare_bypass_v4.md
    - API-viitteet: API.md

  - Laadunvarmistus & Testaus:
    - Testaus (Unit, Integration, E2E): testing.md
    - Vianmääritys (Auth): troubleshooting_auth.md

  - Operointi:
    - MLOps (MLflow): MLflow.md
    - Observability & Monitoring: observability.md
    - Tuotannon Roadmap: production_roadmap.md
    - Roadmap V2: roadmap_v2.md
    - iOS-migraatio: ios_migration_plan.md

  - Viitteet:
    - Sisäiset muistiot: sami_memo.md

